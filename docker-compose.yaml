services:
  fastapi:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: rag-fastapi
    image: rag-fastapi:0.0.1
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    gpus: all
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload